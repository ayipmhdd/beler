<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asah Otak Matematika</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Aplikasi PWA Asah Otak Matematika untuk latihan berhitung sehari-hari.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <!-- Tailwind CSS (Offline Local Script) -->
    <script src="tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base styles for Native App feel */
        body {
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-color: #020617; /* slate-950 */
        }
        
        /* Smooth micro-animations for UI transitions */
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-slate-50 font-sans min-h-screen flex justify-center w-full selection:bg-indigo-500/30">
    
    <!-- Mobile-First Main Container -->
    <div id="app" class="w-full max-w-md bg-slate-900 shadow-2xl relative overflow-hidden flex flex-col min-h-screen border-x border-slate-800/50">
        <!-- Javascript will inject the screens dynamically here -->
    </div>

    <!-- App Logic -->
    <script src="script.js"></script>

    <!-- Standard Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(registration => {
                        console.log('Service Worker successfully registered with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.error('Service Worker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
