<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beler</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Aplikasi latihan mengasah otak biar gak beler-beler amat.">
    <link rel="icon" href="assets/cat-drooling.jpg">
    <!-- Tailwind CSS (Offline Local Script) -->
    <script src="tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base styles for Native App feel */
        body {
            overscroll-behavior-y: contain;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-color: #020617;
            overflow: hidden;
            height: 100dvh;
        }
        
        /* Smooth micro-animations for UI transitions */
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Feedback toast slide-down animation */
        #feedback-toast {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            pointer-events: none;
            transform: translateY(-100%);
            transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #feedback-toast.toast-visible {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans w-full h-[100dvh] overflow-hidden flex justify-center selection:bg-blue-500/30">
    
    <!-- Master wrapper: constrains toast + app to max-w-md, full dvh -->
    <div class="relative w-full max-w-md h-[100dvh] overflow-hidden flex flex-col mx-auto">

        <!-- Feedback Toast (outside #app so it survives innerHTML re-renders) -->
        <div id="feedback-toast">
            <div id="feedback-toast-inner" class="flex items-center justify-center gap-3 py-4 px-6 text-white font-black text-base tracking-wide shadow-lg"></div>
        </div>

        <!-- Mobile-First Main Container -->
        <div id="app" class="w-full bg-[#0b0f19] relative flex flex-col h-full overflow-hidden border-x border-slate-800/50">
            <!-- Javascript will inject the screens dynamically here -->
        </div>

    </div>

    <!-- Startup Sound Effect -->
    <audio id="splash-sfx" src="assets/sound-effects/subway-surfers-revive.mp3" preload="auto"></audio>

    <!-- App Logic -->
    <script src="script.js" type="module"></script>
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker successfully registered with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.error('Service Worker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
